<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoalPulse — Live Football Scores</title>
<meta name="description" content="Live football scores, fixtures and results for Premier League, La Liga, Serie A, Bundesliga and more."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cabinet+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0B1730;
  --nav: #080f22;
  --card: #0f1e3d;
  --card2: #162448;
  --card3: #1E3163;
  --border: rgba(255,255,255,0.08);
  --gold: #D4A843;
  --gold-light: #F0C96A;
  --gold-dim: rgba(212,168,67,0.15);
  --white: #FFFFFF;
  --text: #eef0f8;
  --sub: #7b8ab8;
  --muted: #3d4f7a;
  --live: #E05454;
  --live-dim: rgba(224,84,84,0.12);
  --green: #2EAA6B;
  --green-dim: rgba(46,170,107,0.12);
  --r: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:80px}

/* MESH BG */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 100% 0%,rgba(212,168,67,0.07) 0%,transparent 60%),radial-gradient(ellipse 60% 60% at 0% 100%,rgba(30,49,99,0.5) 0%,transparent 60%);pointer-events:none;z-index:0}

/* TOP AD */
.ad-bar{background:var(--nav);border-bottom:1px solid var(--border);text-align:center;padding:8px 16px;font-size:11px;color:var(--sub);letter-spacing:1px;text-transform:uppercase;position:relative;z-index:10}
.ad-bar-inner{display:inline-flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:8px 40px;min-width:300px;min-height:48px;font-size:11px;color:var(--muted)}

/* HEADER — 433 style */
.header{position:sticky;top:0;z-index:200;background:rgba(8,15,34,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-top{max-width:1200px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.header-right{display:flex;align-items:center;gap:12px}
.header-btn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all 0.2s;color:var(--text)}
.header-btn:hover{background:var(--card3);border-color:var(--gold)}
.search-bar{display:none;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text);outline:none;font-family:'Cabinet Grotesk',sans-serif;width:200px}
.search-bar::placeholder{color:var(--sub)}

/* LEAGUE TABS — 433 style horizontal scroll */
.tabs-wrap{background:var(--nav);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:199}
.tabs-inner{max-width:1200px;margin:0 auto;padding:0 8px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:13px 16px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;font-family:'Cabinet Grotesk',sans-serif;letter-spacing:0.3px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-flag{width:18px;height:13px;border-radius:2px;overflow:hidden;flex-shrink:0}
.tab-flag svg{width:100%;height:100%}

/* DATE STRIP — 433 style */
.date-wrap{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:103px;z-index:198}
.date-inner{max-width:1200px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.date-inner::-webkit-scrollbar{display:none}
.date-pill{flex-shrink:0;padding:6px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--sub);background:transparent;transition:all 0.2s;font-family:'Cabinet Grotesk',sans-serif}
.date-pill:hover{border-color:var(--gold);color:var(--gold)}
.date-pill.active{background:var(--gold);color:#0B1730;border-color:var(--gold);font-weight:800}

/* LAYOUT */
.layout{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr;gap:16px;position:relative;z-index:1}
@media(min-width:900px){.layout{grid-template-columns:1fr 320px}}

/* MAIN CONTENT */
.main-col{}

/* SIDEBAR */
.sidebar{display:none}
@media(min-width:900px){.sidebar{display:flex;flex-direction:column;gap:16px}}

/* LEAGUE SECTION */
.league-section{margin-bottom:8px}

/* LEAGUE HEADER — 433 style */
.league-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card2);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--border);border-bottom:none;cursor:pointer}
.league-header-flag{width:22px;height:16px;border-radius:2px;overflow:hidden;flex-shrink:0}
.league-header-flag svg{width:100%;height:100%}
.league-header-name{font-size:12px;font-weight:800;color:var(--text);flex:1;letter-spacing:0.5px;text-transform:uppercase}
.league-header-count{font-size:11px;color:var(--sub);font-weight:600}
.league-header-arrow{font-size:11px;color:var(--muted);transition:transform 0.2s}
.league-header.collapsed .league-header-arrow{transform:rotate(-90deg)}

/* MATCH CARD — 433 style */
.match-card{background:var(--card);border:1px solid var(--border);border-top:none;padding:12px 14px;cursor:pointer;transition:background 0.15s;position:relative;overflow:hidden}
.match-card:last-child{border-radius:0 0 var(--r) var(--r)}
.match-card:hover{background:var(--card2)}
.match-card.live-card{background:linear-gradient(135deg,rgba(224,84,84,0.06),var(--card))}
.match-card.live-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--live)}

/* 433 centered match layout */
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team-side{display:flex;align-items:center;gap:8px}
.team-side.away{flex-direction:row-reverse;text-align:right}
.team-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;border:1.5px solid var(--border);color:var(--text)}
.team-info{}
.team-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;max-width:110px}
.team-name.small{font-size:12px}

/* SCORE CENTER */
.score-center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px}
.score-nums{display:flex;align-items:center;gap:4px}
.score-num{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:var(--text);min-width:24px;text-align:center}
.score-num.live{color:var(--gold)}
.score-sep{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--muted);line-height:1}
.match-meta{display:flex;align-items:center;justify-content:center;gap:5px}
.match-time-txt{font-size:11px;font-weight:600;color:var(--sub)}
.status-badge{font-size:10px;font-weight:800;letter-spacing:0.8px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.s-live{background:var(--live-dim);color:var(--live)}
.s-ft{background:rgba(255,255,255,0.07);color:var(--sub)}
.s-ns{background:rgba(212,168,67,0.12);color:var(--gold)}
.s-ht{background:rgba(46,170,107,0.12);color:var(--green)}
.live-min{font-size:10px;font-weight:800;color:var(--live);display:flex;align-items:center;gap:4px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* SCORERS */
.scorers-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.scorer-list{font-size:10px;color:var(--sub);flex:1;line-height:1.6}
.scorer-list.right{text-align:right}

/* AD INLINE */
.ad-inline{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:10px 0;text-align:center;font-size:11px;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;min-height:80px;display:flex;align-items:center;justify-content:center;border-style:dashed}

/* SHIMMER */
.shimmer{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r);height:72px;margin-bottom:4px}
@keyframes shimmer{to{background-position:-200% 0}}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;color:var(--sub)}
.empty-icon{font-size:44px;margin-bottom:14px;display:block}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)}
.empty-sub{font-size:13px;color:var(--sub)}

/* ERROR */
.error-state{background:rgba(224,84,84,0.08);border:1px solid rgba(224,84,84,0.2);border-radius:var(--r);padding:20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}

/* SIDEBAR WIDGETS */
.widget{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.widget-head{padding:12px 16px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.widget-head-flag{width:20px;height:14px;border-radius:2px;overflow:hidden}
.widget-head-flag svg{width:100%;height:100%}
.widget-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--text);flex:1}
.widget-link{font-size:11px;color:var(--gold);font-weight:700;text-decoration:none}
.standing-row{display:grid;grid-template-columns:24px 1fr 28px 28px 28px 32px;align-items:center;gap:4px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px}
.standing-row:last-child{border-bottom:none}
.standing-row:hover{background:var(--card2)}
.st-pos{font-weight:700;color:var(--sub);text-align:center;font-size:11px}
.st-pos.top4{color:var(--gold)}
.st-pos.top6{color:var(--green)}
.st-pos.rel{color:var(--live)}
.st-team{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-num{text-align:center;color:var(--sub);font-size:11px}
.st-pts{text-align:center;font-weight:800;color:var(--text)}

/* BOTTOM NAV — 433 style */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,15,34,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:300;height:64px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:0.3px;border:none;background:none;font-family:'Cabinet Grotesk',sans-serif;transition:color 0.2s;padding:8px 0}
.nav-btn.active{color:var(--gold)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--card2);border:1px solid var(--border);padding:10px 20px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:all 0.25s;pointer-events:none;z-index:400;white-space:nowrap;color:var(--text)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* FADE IN */
.fade-in{animation:fadeIn 0.35s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* DESKTOP ADJUSTMENTS */
@media(min-width:900px){
  .bottom-nav{display:none}
  body{padding-bottom:0}
  .team-name{max-width:140px}
}
</style>
</head>

<script>
// ─── CONFIG ───────────────────────────────
const API = 'https://www.thesportsdb.com/api/v1/json/3';
let currentLeague = 'all';
let currentDate = todayStr();
let allMatches = [];

// Team badge colors — navy/gold palette
const BADGE_COLORS = [
  ['#D4A843','#0B1730'],['#2EAA6B','#0B1730'],['#E05454','#fff'],
  ['#1E3163','#D4A843'],['#162448','#F0C96A'],['#0f1e3d','#fff'],
  ['#D4A843','#162448'],['#2979ff','#fff'],['#7b8ab8','#0B1730'],
  ['#F0C96A','#0B1730'],
];

function badgeColor(name){
  let h=0;for(let c of name)h=(h*31+c.charCodeAt(0))&0xffffffff;
  return BADGE_COLORS[Math.abs(h)%BADGE_COLORS.length];
}

// ─── DATE HELPERS ─────────────────────────
function todayStr(){return new Date().toISOString().split('T')[0]}

function buildDateStrip(){
  const strip = document.getElementById('dateStrip');
  strip.innerHTML='';
  const labels={'-3':'3 Days Ago','-2':'2 Days Ago','-1':'Yesterday','0':'Today','1':'Tomorrow','2':'In 2 Days'};
  for(let i=-3;i<=2;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const str=d.toISOString().split('T')[0];
    const label=labels[i]||(i<0?`${Math.abs(i)} Days Ago`:`In ${i} Days`);
    const pill=document.createElement('button');
    pill.className='date-pill'+(str===currentDate?' active':'');
    pill.textContent=label;
    pill.onclick=()=>{
      currentDate=str;
      document.querySelectorAll('.date-pill').forEach(p=>p.classList.remove('active'));
      pill.classList.add('active');
      loadScores();
    };
    strip.appendChild(pill);
  }
}

// ─── FETCH ────────────────────────────────
async function loadScores(){
  const el=document.getElementById('scoresContent');
  el.innerHTML='<div class="shimmer"></div><div class="shimmer"></div><div class="shimmer"></div><div class="shimmer"></div>';
  try{
    const r=await fetch(`${API}/eventsday.php?d=${currentDate}&s=Soccer`);
    const d=await r.json();
    allMatches=d.events||[];
    renderScores();
  }catch(e){
    el.innerHTML='<div class="error-state">⚠️ Could not load scores.<br><small>Check your connection and try again.</small></div>';
  }
}

async function loadStandings(){
  // PL = 4328, La Liga = 4335 in TheSportsDB
  try{
    const [pl,ll]=await Promise.all([
      fetch(`${API}/lookuptable.php?l=4328&s=2024-2025`).then(r=>r.json()),
      fetch(`${API}/lookuptable.php?l=4335&s=2024-2025`).then(r=>r.json()),
    ]);
    renderStandings('plStandings', pl.table||[]);
    renderStandings('llStandings', ll.table||[]);
  }catch(e){}
}

function renderStandings(elId, table){
  const el=document.getElementById(elId);
  if(!table.length){el.innerHTML='<div style="padding:16px;text-align:center;font-size:12px;color:var(--sub)">No data</div>';return;}
  el.innerHTML=table.slice(0,8).map((t,i)=>{
    const pos=i+1;
    let posClass='st-pos';
    if(pos<=4)posClass+=' top4';
    else if(pos<=6)posClass+=' top6';
    else if(pos>=18)posClass+=' rel';
    const [bg,fg]=badgeColor(t.strTeam||'');
    return `<div class="standing-row">
      <span class="${posClass}">${pos}</span>
      <span class="st-team">${t.strTeam||''}</span>
      <span class="st-num">${t.intPlayed||0}</span>
      <span class="st-num">${t.intWin||0}</span>
      <span class="st-num">${t.intLoss||0}</span>
      <span class="st-pts">${t.intPoints||0}</span>
    </div>`;
  }).join('');
}

// ─── RENDER SCORES ────────────────────────
function renderScores(){
  const el=document.getElementById('scoresContent');
  el.innerHTML='';

  let matches=[...allMatches];

  // Filter by league tab
  if(currentLeague!=='all'){
    matches=matches.filter(m=>m.strLeague&&m.strLeague.toLowerCase().includes(currentLeague.toLowerCase().split(' ')[0]));
  }

  if(!matches.length){
    el.innerHTML=`<div class="empty-state"><span class="empty-icon">📅</span><div class="empty-title">No matches today</div><div class="empty-sub">Try a different date or league tab</div></div>`;
    return;
  }

  // Group by league
  const grouped={};
  matches.forEach(m=>{
    const k=m.strLeague||'Other';
    if(!grouped[k])grouped[k]=[];
    grouped[k].push(m);
  });

  let cardCount=0;
  Object.entries(grouped).forEach(([league,games])=>{
    const section=document.createElement('div');
    section.className='league-section fade-in';

    // League header
    const hdr=document.createElement('div');
    hdr.className='league-header';
    hdr.innerHTML=`
      <div class="league-header-flag">${getLeagueFlag(league)}</div>
      <span class="league-header-name">${league}</span>
      <span class="league-header-count">${games.length} matches</span>
      <span class="league-header-arrow">▾</span>`;
    hdr.onclick=()=>{
      hdr.classList.toggle('collapsed');
      const cards=section.querySelectorAll('.match-card,.ad-inline');
      cards.forEach(c=>c.style.display=hdr.classList.contains('collapsed')?'none':'');
    };
    section.appendChild(hdr);

    games.forEach(match=>{
      cardCount++;
      if(cardCount%7===0){
        const ad=document.createElement('div');
        ad.className='ad-inline';
        ad.textContent='Advertisement';
        section.appendChild(ad);
      }
      section.appendChild(buildCard(match));
    });

    el.appendChild(section);
  });
}

function buildCard(m){
  const card=document.createElement('div');
  const status=m.strStatus||'';
  const isLive=status.includes("'")||status==='In Progress'||status==='1H'||status==='2H';
  const isFT=status==='Match Finished';
  const isHT=status==='HT';

  card.className='match-card'+(isLive?' live-card':'');

  const hs=m.intHomeScore!=null?m.intHomeScore:'-';
  const as=m.intAwayScore!=null?m.intAwayScore:'-';
  const time=m.strTime?m.strTime.slice(0,5):'--:--';

  let statusHtml='';
  if(isLive)statusHtml=`<span class="live-min"><span class="live-dot"></span>${status}</span>`;
  else if(isFT)statusHtml=`<span class="status-badge s-ft">FT</span>`;
  else if(isHT)statusHtml=`<span class="status-badge s-ht">HT</span>`;
  else statusHtml=`<span class="status-badge s-ns">${time}</span>`;

  const home=m.strHomeTeam||'Home';
  const away=m.strAwayTeam||'Away';
  const [hbg,hfg]=badgeColor(home);
  const [abg,afg]=badgeColor(away);

  card.innerHTML=`
    <div class="match-row">
      <div class="team-side home">
        <div class="team-badge" style="background:${hbg};color:${hfg};border-color:${hbg}">${home.substring(0,2).toUpperCase()}</div>
        <div class="team-info"><div class="team-name${home.length>12?' small':''}">${home}</div></div>
      </div>
      <div class="score-center">
        <div class="score-nums">
          <span class="score-num${isLive?' live':''}">${hs}</span>
          <span class="score-sep">:</span>
          <span class="score-num${isLive?' live':''}">${as}</span>
        </div>
        <div class="match-meta">${statusHtml}</div>
      </div>
      <div class="team-side away">
        <div class="team-badge" style="background:${abg};color:${afg};border-color:${abg}">${away.substring(0,2).toUpperCase()}</div>
        <div class="team-info"><div class="team-name${away.length>12?' small':''}">${away}</div></div>
      </div>
    </div>`;

  card.onclick=()=>toast(`${home} ${hs} : ${as} ${away}`);
  return card;
}

// ─── FLAG SVGs ────────────────────────────
function getLeagueFlag(league){
  const l=league.toLowerCase();
  if(l.includes('premier')||l.includes('english'))
    return `<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="white" stroke-width="6"/><path d="M0 0L60 40M60 0L0 40" stroke="#C8102E" stroke-width="4"/><path d="M30 0V40M0 20H60" stroke="white" stroke-width="10"/><path d="M30 0V40M0 20H60" stroke="#C8102E" stroke-width="6"/></svg>`;
  if(l.includes('liga')||l.includes('spanish'))
    return `<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#c60b1e"/><rect y="10" width="60" height="20" fill="#ffc400"/></svg>`;
  if(l.includes('serie')||l.includes('italian'))
    return `<svg viewBox="0 0 60 40"><rect width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ce2b37"/></svg>`;
  if(l.includes('bundesliga')||l.includes('german'))
    return `<svg viewBox="0 0 60 40"><rect width="60" height="14" fill="#000"/><rect y="13" width="60" height="14" fill="#D00"/><rect y="26" width="60" height="14" fill="#FFCE00"/></svg>`;
  if(l.includes('ligue')||l.includes('french'))
    return `<svg viewBox="0 0 60 40"><rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ED2939"/></svg>`;
  if(l.includes('champions'))
    return `<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#001f6e"/><text x="30" y="26" text-anchor="middle" font-size="18" fill="#ffd700">★</text></svg>`;
  if(l.includes('europa'))
    return `<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#f36f21"/><text x="30" y="26" text-anchor="middle" font-size="14" fill="#fff">UEL</text></svg>`;
  return `<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#1E3163"/><text x="30" y="26" text-anchor="middle" font-size="14" fill="#D4A843">⚽</text></svg>`;
}

// ─── TABS ─────────────────────────────────
document.getElementById('leagueTabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(!tab)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  currentLeague=tab.dataset.league;
  renderScores();
});

// ─── NAV ──────────────────────────────────
function navClick(btn,tab){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab!=='scores')toast('Coming in Phase 2 🔥');
}

// ─── SEARCH ───────────────────────────────
function toggleSearch(){
  const s=document.getElementById('searchBar');
  s.style.display=s.style.display==='block'?'none':'block';
  if(s.style.display==='block')s.focus();
}

// ─── TOAST ────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── INIT ─────────────────────────────────
buildDateStrip();
loadScores();
loadStandings();
setInterval(loadScores,60000);
</script>
